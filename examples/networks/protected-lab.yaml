apiVersion: virmill/v1
kind: Network
metadata:
  name: protected-lab
  displayName: Lab with managed DHCP and DNS host access only
  tags: [example]
spec:
  type: lab
  ipv4:
    cidr: 10.197.241.0/24
    dhcp: {enabled: true, advertiseDefaultRoute: false}
  ipv6: {mode: disabled}
  hostAccess: services-only
  egress: none
