apiVersion: virmill/v1
kind: Network
metadata:
  name: protected-nat
  displayName: NAT with managed DHCP and DNS host access only
  tags: [example]
spec:
  type: nat
  ipv4:
    cidr: 10.197.240.0/24
    dhcp: {enabled: true, advertiseDefaultRoute: true}
  ipv6: {mode: disabled}
  hostAccess: services-only
  egress: any
